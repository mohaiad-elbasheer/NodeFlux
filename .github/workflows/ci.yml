name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit & statistical tests
        run: |
          npx tsx scripts/test-csv.ts
          npx tsx scripts/test-engine.ts
          npx tsx scripts/test-stochastic.ts
      - name: Browser suites
        run: |
          npm i --no-save playwright@$(node -p "require('playwright-core/package.json').version")
          npx playwright install --with-deps chromium
          export CHROMIUM_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
          node scripts/verify-ui.mjs
          node scripts/verify-simulation.mjs
          node scripts/verify-e2e.mjs
